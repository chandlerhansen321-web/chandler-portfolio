# Security fixes only, bundled into one PR per run (2026-11-24).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0   # no routine version-bump PRs; security updates still open
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
